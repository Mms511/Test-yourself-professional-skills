<style>:root{color-scheme:light;--paper:#f5f4ef;--card:#fff;--ink:#192d25;--muted:#50635a;--line:#e0e7df;--green:#184c37;--soft:#e8f1e9;--ring:#326b50;--success:#1c6243;--error:#962f35;--error-bg:#fff0ef;--radius:22px}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Roboto","Segoe UI",Tahoma,sans-serif;line-height:1.65}
button{font:inherit;cursor:pointer}button:disabled{cursor:default} button:focus-visible,a:focus-visible{outline:3px solid var(--ring);outline-offset:4px}
.wrap{width:min(1120px,calc(100% - 48px));margin-inline:auto}
.top{background:var(--card);border-bottom:1px solid var(--line)}

.course{color:var(--muted);font-weight:600;font-size:14px}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:26px;align-items:start;padding-block:40px 64px}
.sidebar,.progress-panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.sidebar{padding:20px 15px 14px}.sidebar h2{font-size:14px;margin:0 10px 13px;color:var(--muted)}
#topics{display:grid;gap:4px}.topic{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:transparent;padding:10px;border-radius:11px;text-align:start;color:var(--ink);font-size:15px;min-height:44px}
.topic:hover,.topic[aria-current=true]{background:var(--soft);color:var(--green)}.topic[aria-current=true]{font-weight:700}.topic-count{font-size:12px;color:var(--muted);white-space:nowrap}
.sidebar-foot{border-top:1px solid var(--line);padding:10px 8px 0;margin-top:15px}.link-button{border:0;background:transparent;color:var(--green);padding:7px 2px;font-size:14px;font-weight:600}
.progress-panel{padding:16px 22px;margin-bottom:15px}.progress-text{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.progress-text strong{font-size:15px}.progress-text span{color:var(--muted);font-size:13px}
progress{display:block;width:100%;height:7px;margin-top:11px;border:0;border-radius:10px;background:var(--soft);overflow:hidden;color:var(--green)}
progress::-webkit-progress-bar{background:var(--soft)}progress::-webkit-progress-value{background:var(--green);border-radius:10px}progress::-moz-progress-bar{background:var(--green)}
.card{padding:28px 32px;box-shadow:0 10px 24px #213b2610}.question-meta,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.question-meta{font-size:13px;color:var(--muted)}
.tag{color:var(--green);background:var(--soft);border-radius:99px;padding:4px 12px;font-weight:700}
h1{font-size:clamp(23px,3vw,33px);line-height:1.48;margin:19px 0 24px;overflow-wrap:anywhere}h1:focus{outline:none}
.options{display:grid;gap:10px}.option{display:flex;align-items:center;gap:13px;text-align:start;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:10px 14px;min-height:58px;width:100%;font-size:16px}.option:hover:not(:disabled){border-color:var(--ring);background:#f6faf6}
.letter{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:9px;background:#eef2ed;color:var(--green);font-weight:700}.option-text{flex:1}.option.correct{background:#eef7ef;border-color:#97bfaa}.option.correct .letter{background:var(--success);color:#fff}.option.wrong{background:var(--error-bg);border-color:#d69ba0}.option.wrong .letter{background:var(--error);color:#fff}.marker{font-size:20px;font-weight:700}

.actions{margin-top:24px;padding-top:17px;border-top:1px solid var(--line)}
.primary,.secondary{min-height:45px;padding:9px 17px;border-radius:10px;font-weight:700;border:1px solid var(--line)}.primary{background:var(--green);color:#fff;border-color:var(--green)}.primary:hover:not(:disabled){background:#226648}.primary:disabled{opacity:.47}.secondary{background:white;color:var(--green)}.secondary:hover:not(:disabled){background:var(--soft)}.secondary:disabled{opacity:.47}

@media(max-width:760px){.wrap{width:calc(100% - 28px)}.layout{display:flex;flex-direction:column;gap:13px;padding-block:18px 35px}.sidebar,main{width:100%}.sidebar{padding:11px}.sidebar h2{margin-bottom:6px}.top-inner{min-height:60px}.brand{font-size:18px}#topics{display:flex;flex-wrap:wrap;gap:5px}.topic{width:auto;background:#f6f7f4;padding:6px 9px;font-size:13px;min-height:39px}.sidebar-foot{padding-top:3px;margin-top:8px}.card{padding:17px}.progress-panel{padding:12px 15px;margin-bottom:12px}.option{min-height:51px;font-size:15px;padding:8px 10px}h1{margin:14px 0 17px}}

.top-tools{display:flex;align-items:center;gap:14px}.theme-toggle,.view-toggle{font-size:14px}

.question-list{display:grid;gap:16px;margin-bottom:16px}.question-list:focus{outline:none}
.list-prompt{font-size:clamp(21px,2.7vw,28px);line-height:1.5;margin:15px 0 19px;overflow-wrap:anywhere}
.option[aria-disabled="true"]{cursor:default}
.option:hover[aria-disabled="true"]:not(.correct):not(.wrong){border-color:var(--line);background:var(--card)}
:root[data-theme="dark"]{color-scheme:dark;--paper:#191919;--card:#242424;--ink:#f1f1f1;--muted:#bfbfbf;--line:#454545;--green:#dedede;--soft:#353535;--ring:#c4c4c4;--success:#e4e4e4;--error:#ffb3b6;--error-bg:#3d2429}
[data-theme="dark"] .option,[data-theme="dark"] .secondary{background:var(--card)}
[data-theme="dark"] .topic{color:var(--ink);background:transparent}
[data-theme="dark"] .topic:hover,[data-theme="dark"] .topic[aria-current="true"],[data-theme="dark"] .secondary:hover:not(:disabled){background:var(--soft);color:var(--green)}
[data-theme="dark"] .option:hover:not([aria-disabled="true"]){background:var(--soft)}
[data-theme="dark"] .letter{background:var(--soft);color:var(--green)}
[data-theme="dark"] .option.correct,[data-theme="dark"] .feedback:not(.incorrect){background:#303030;border-color:#898989}
[data-theme="dark"] .option.wrong{background:var(--error-bg);border-color:#a65f66}
[data-theme="dark"] .option.correct .letter,[data-theme="dark"] .option.wrong .letter{color:#191919}
[data-theme="dark"] .primary,[data-theme="dark"] .brand-icon{color:#191919}
[data-theme="dark"] .primary:hover:not(:disabled){background:#c8c8c8}
@media(max-width:560px){.top-tools .course{display:none}.theme-toggle{min-height:39px;padding:5px 9px}}
</style>


</head>
<body>
<header class="top"><div class="wrap top-inner">
  <div class="brand"><span class="brand-icon" aria-hidden="true">✓</span><span>اختبر نفسك</span></div>
  <div class="top-tools"><span class="course">المهارات المهنية</span><button class="secondary theme-toggle" id="theme" type="button" aria-pressed="false">☾ الوضع الداكن</button></div>
</div></header>
<div class="wrap layout">
  <aside class="sidebar" aria-label="أقسام الاختبار">
    <h2>أقسام الاختبار</h2>
    <nav id="topics"></nav>
    <div class="sidebar-foot"><button class="link-button" id="restart">↻ إعادة الاختبار</button></div>
  </aside>
  <main id="main">
    <section class="progress-panel" aria-label="التقدّم">
      <div class="progress-text"><strong id="session"></strong><span id="answeredCount"></span></div>
      <progress id="progress" value="0" max="87" aria-label="الأسئلة المجابة"></progress>
    </section>
    <button class="secondary view-toggle" id="layoutToggle" type="button" aria-controls="questionCard questionList">عرض سؤال واحد</button>
    <section id="questionCard" class="card" aria-labelledby="prompt">
      <div class="question-meta"><span id="topicLabel" class="tag"></span><span id="counter"></span></div>
      <h1 id="prompt" tabindex="-1"></h1>
      <div id="options" class="options" aria-label="خيارات الإجابة"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="actions">
        <button class="secondary" id="prev">→ <span>السابق</span></button>
        <button class="primary" id="next">السؤال التالي ←</button>
      </div>
    </section>
    <div id="questionList" class="question-list" role="region" aria-label="الأسئلة في صفحة واحدة" tabindex="-1" hidden></div>
    <section id="result" class="card results" aria-labelledby="resultTitle" hidden></section>
  </main>
</div>

"use strict";
const all = sections.flatMap(section => section.questions);
const topics = Object.fromEntries(sections.map(section => [section.id, section]));
const byId = new Map(all.map(question => [question.id, question]));
const fmt = new Intl.NumberFormat("ar-SA", { useGrouping: false });
const labels = ["أ", "ب", "ج", "د"];
const key = "career-quiz-2026-v1";
const ui = Object.fromEntries(
  ["topics", "restart", "session", "answeredCount", "progress", "questionCard", "topicLabel",
    "counter", "prompt", "options", "feedback", "prev", "next", "result", "theme", "layoutToggle", "questionList"].map(id => [id, document.getElementById(id)])
);
const initial = () => ({ topic: "all", index: 0, answers: {}, view: "quiz", review: null });
function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(key));
    if (saved && (saved.topic === "all" || topics[saved.topic]) && saved.answers && Number.isInteger(saved.index)) {
      return saved;
    }
  } catch {}
  return initial();
}
let state = restore();

const preferencesKey = "career-quiz-preferences-v1";
let preferences = { dark: false, list: true };
try {
  const saved = JSON.parse(localStorage.getItem(preferencesKey));
  if (saved && typeof saved.dark === "boolean" && typeof saved.list === "boolean") preferences = saved;
} catch {}
function updatePreferences() {
  document.documentElement.dataset.theme = preferences.dark ? "dark" : "light";
  ui.theme.setAttribute("aria-pressed", String(preferences.dark));
  ui.theme.textContent = (preferences.dark ? "☀ " : "☾ ") + "الوضع الداكن";
  ui.layoutToggle.textContent = preferences.list ? "عرض سؤال واحد" : "عرض كل الأسئلة في صفحة واحدة";
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", preferences.dark ? "#191919" : "#f5f4ef");
  try { localStorage.setItem(preferencesKey, JSON.stringify(preferences)); } catch {}
}
ui.theme.addEventListener("click", () => {
  preferences.dark = !preferences.dark;
  updatePreferences();
});
ui.layoutToggle.addEventListener("click", () => {
  preferences.list = !preferences.list;
  state.view = "quiz";
  if (!preferences.list) {
    const unanswered = pool().findIndex(question => !Number.isInteger(answers()[question.id]));
    if (unanswered >= 0) state.index = unanswered;
  }
  updatePreferences();
  render();
});
updatePreferences();

function persist() {
  try { localStorage.setItem(key, JSON.stringify(state)); } catch {}
}
function basePool() {
  return topics[state.topic]?.questions ?? all;
}
function pool() {
  return state.review ? state.review.ids.map(id => byId.get(id)) : basePool();
}
function answers() {
  return state.review?.answers ?? state.answers;
}
function count(list, responses) {
  return list.filter(question => Number.isInteger(responses[question.id])).length;
}
function element(tag, content, className) {
  const node = document.createElement(tag);
  if (content) node.textContent = content;
  if (className) node.className = className;
  return node;
}
function showTopic(topic) {
  state.topic = topic;
  state.review = null;
  const first = basePool().findIndex(question => !Number.isInteger(state.answers[question.id]));
  state.index = Math.max(0, first);
  state.view = "quiz";
  render(true);
}
function renderTopics() {
  const rows = [{ id: "all", title: "كل الأسئلة", questions: all }, ...sections];
  if (!ui.topics.childElementCount) {
    for (const row of rows) {
      const button = element("button", "", "topic");
      button.append(element("span", row.title), element("span", "", "topic-count"));
      button.addEventListener("click", () => showTopic(row.id));
      ui.topics.append(button);
    }
  }
  rows.forEach((row, index) => {
    const button = ui.topics.children[index];
    const amount = count(row.questions, state.answers);
    button.setAttribute("aria-current", String(state.topic === row.id && !state.review));
    button.lastElementChild.textContent = fmt.format(row.questions.length);
    button.setAttribute("aria-label", row.title + "، أجبت عن " + fmt.format(amount) + " من " + fmt.format(row.questions.length));
  });
}
function renderFeedback(question, selected, target) {
  target.replaceChildren();
  target.classList.toggle("incorrect", Number.isInteger(selected) && selected !== question.key);
  if (!Number.isInteger(selected)) return;
  const correct = selected === question.key;
  target.append(element("h2", correct ? "✓ إجابة صحيحة" : "✕ إجابة خاطئة"));
  if (!correct) {
    target.append(element("p", "الإجابة الصحيحة: " + question.options[question.key]));
  }
  target.append(element("p", question.exp));
  for (const [label, url] of question.refs) {
    const link = element("a", label + " ↗");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    target.append(link);
  }
}
function renderOptions(question, container, feedback, onAnswer) {
  const selected = answers()[question.id];
  const hasAnswer = Number.isInteger(selected);
  container.replaceChildren();
  question.options.forEach((option, index) => {
    const button = element("button", "", "option");
    const letter = element("span", labels[index], "letter");
    letter.setAttribute("aria-hidden", "true");
    button.append(letter, element("span", option, "option-text"));
    button.setAttribute("aria-disabled", String(hasAnswer));
    if (hasAnswer) button.tabIndex = -1;
    if (hasAnswer && (index === question.key || index === selected)) {
      const correct = index === question.key;
      button.classList.add(correct ? "correct" : "wrong");
      button.append(element("span", correct ? "✓" : "✕", "marker"));
      button.setAttribute("aria-label", option + (correct ? "، الإجابة الصحيحة" : "، إجابتك الخاطئة"));
    }
    button.addEventListener("click", () => {
      if (hasAnswer || Number.isInteger(answers()[question.id])) return;
      answers()[question.id] = index;
      onAnswer();
      container.children[index].focus({ preventScroll: true });
    });
    container.append(button);
  });
  renderFeedback(question, selected, feedback);
  return hasAnswer;
}
function renderQuestion(list, moveFocus) {
  state.index = Math.max(0, Math.min(state.index, list.length - 1));
  const question = list[state.index];
  ui.topicLabel.textContent = topics[question.section].title;
  ui.counter.textContent = "السؤال " + fmt.format(state.index + 1) + " من " + fmt.format(list.length);
  ui.prompt.textContent = question.prompt;
  const hasAnswer = renderOptions(question, ui.options, ui.feedback, () => render());
  ui.prev.disabled = state.index === 0;
  ui.next.disabled = !hasAnswer;
  ui.next.textContent = state.index === list.length - 1 ? "عرض النتيجة ←" : "السؤال التالي ←";
  if (moveFocus) ui.prompt.focus();
}

function renderList(list, moveFocus) {
  ui.questionList.replaceChildren();
  list.forEach((question, index) => {
    const card = element("section", "", "card");
    const meta = element("div", "", "question-meta");
    meta.append(
      element("span", topics[question.section].title, "tag"),
      element("span", "السؤال " + fmt.format(index + 1) + " من " + fmt.format(list.length))
    );
    const title = element("h2", question.prompt, "list-prompt");
    title.id = "question-" + question.id;
    card.setAttribute("aria-labelledby", title.id);
    const options = element("div", "", "options");
    const feedback = element("div", "", "feedback");
    feedback.setAttribute("aria-live", "polite");
    const updateCard = () => renderOptions(question, options, feedback, () => {
      updateCard();
      renderProgress(list);
      renderListResult(list);
      persist();
    });
    updateCard();
    card.append(meta, title, options, feedback);
    ui.questionList.append(card);
  });
  if (moveFocus) ui.questionList.focus();
}
function renderListResult(list) {
  ui.result.hidden = count(list, answers()) < list.length;
  if (!ui.result.hidden) renderResult(list, false);
}
function resultButton(label, action, style = "secondary") {
  const button = element("button", label, style);
  button.addEventListener("click", action);
  return button;
}
function renderResult(list, moveFocus) {
  const responses = answers();
  const correct = list.filter(question => responses[question.id] === question.key).length;
  const wrong = list.filter(question => Number.isInteger(responses[question.id]) && responses[question.id] !== question.key);
  const pending = list.length - correct - wrong.length;
  const title = element("h1", state.review ? "نتيجة مراجعة الأخطاء" : "نتيجة الاختبار");
  title.id = "resultTitle";
  title.tabIndex = -1;
  ui.result.replaceChildren(
    title,
    element("div", fmt.format(correct) + " / " + fmt.format(list.length), "score"),
    element("p", fmt.format(correct) + " صحيحة · " + fmt.format(wrong.length) + " خاطئة" +
      (pending ? " · " + fmt.format(pending) + " بلا إجابة" : ""))
  );
  const actions = element("div", "", "result-actions");
  if (wrong.length) actions.append(resultButton("أعد الأسئلة الخاطئة", () => {
    state.review = { ids: wrong.map(question => question.id), answers: {} };
    state.index = 0;
    state.view = "quiz";
    render(true);
  }, "primary"));
  if (pending) actions.append(resultButton("أكمل الأسئلة المتبقية", () => {
    state.index = list.findIndex(question => !Number.isInteger(answers()[question.id]));
    state.view = "quiz";
    render(true);
  }, "primary"));
  actions.append(resultButton("راجع إجاباتك", () => {
    if (preferences.list) { ui.questionList.focus(); return; }
    state.index = 0;
    state.view = "quiz";
    render(true);
  }));
  if (state.review) actions.append(resultButton("العودة للاختبار", () => showTopic(state.topic)));
  ui.result.append(actions);
  if (moveFocus) title.focus();
}
function renderProgress(list) {
  const answered = count(list, answers());
  ui.session.textContent = state.review ? "مراجعة الأخطاء" : (topics[state.topic]?.title ?? "كل الأسئلة");
  ui.answeredCount.textContent = "أجبت عن " + fmt.format(answered) + " من " + fmt.format(list.length);
  ui.progress.max = list.length;
  ui.progress.value = answered;
  renderTopics();
}
function render(moveFocus = false) {
  const list = pool();
  renderProgress(list);
  const showList = preferences.list;
  const showResult = !showList && state.view === "result";
  ui.questionList.hidden = !showList;
  ui.questionCard.hidden = showList || showResult;
  ui.result.hidden = !showResult;
  if (showList) {
    renderList(list, moveFocus);
    renderListResult(list);
  } else if (showResult) {
    renderResult(list, moveFocus);
  } else {
    renderQuestion(list, moveFocus);
  }
  persist();
}
ui.prev.addEventListener("click", () => {
  if (state.index > 0) { state.index--; render(true); }
});
ui.next.addEventListener("click", () => {
  const list = pool();
  if (!Number.isInteger(answers()[list[state.index].id])) return;
  if (state.index === list.length - 1) state.view = "result";
  else state.index++;
  render(true);
});
ui.restart.addEventListener("click", () => {
  if (count(all, state.answers) && !window.confirm("إعادة الاختبار تمسح تقدّمك الحالي في جميع الأقسام. هل تريد المتابعة؟")) return;
  state = initial();
  render(true);
});
render();
